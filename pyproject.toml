[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phishverdict"
version = "1.0.0"
description = "Offline phishing-URL triage CLI -- score suspicious URLs before a human clicks or a bot fetches them"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["phishing", "security", "triage", "url-analysis", "threat-intelligence", "blue-team"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.scripts]
phishverdict = "phishverdict.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishverdict = ["py.typed"]
